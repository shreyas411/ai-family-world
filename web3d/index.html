<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Family World · 3D house</title>
<style>
  html, body, #root { margin:0; height:100%; overflow:hidden; font:13px/1.35 system-ui, -apple-system, sans-serif; color:#1d1d1d; background:#0c1626; }
  .app { position:relative; height:100%; }
  .app canvas { display:block; }
  button, select, .btn { font:inherit; padding:4px 9px; border:1px solid #d6d2c8; border-radius:7px; background:#fff; cursor:pointer; color:#1d1d1d; text-decoration:none; }
  button:hover, select:hover, .btn:hover { background:#f4f2ec; }
  .bar { position:absolute; top:0; left:0; right:0; display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:8px 12px;
    background:rgba(255,255,255,.88); backdrop-filter:blur(6px); border-bottom:1px solid #e3dfd5; }
  .sp { flex:1; }
  .pill { background:#eef4fc; color:#1f5fae; border-radius:999px; padding:2px 9px; font-size:12px; }
  .clock { font-variant-numeric:tabular-nums; font-weight:600; }
  .rec { background:#fde8e8; border-color:#e6a1a1; }
  .family { position:absolute; left:10px; top:58px; width:230px; max-height:calc(100% - 200px); overflow:auto; background:rgba(255,255,255,.9);
    border-radius:10px; padding:6px; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  .who { display:flex; gap:8px; padding:6px; border-radius:7px; cursor:pointer; }
  .who:hover { background:#f4f2ec; } .who.on { background:#eef4fc; }
  .who.sm { padding:4px; }
  .ava { width:38px; height:38px; border-radius:50%; border:2px solid; object-fit:cover; flex:none; }
  .who.sm .ava { width:28px; height:28px; }
  .dot { width:11px; height:11px; border-radius:50%; margin-top:4px; flex:none; }
  .act { color:#444; } .loc { color:#7a756b; font-size:12px; } small, .muted { color:#7a756b; } .small { font-size:12px; }
  .hint { color:#7a756b; font-size:11.5px; padding:6px; border-top:1px solid #eee; margin-top:4px; }
  .inspect { position:absolute; right:10px; top:58px; width:270px; max-height:calc(100% - 200px); overflow:auto; background:rgba(255,255,255,.93);
    border-radius:10px; padding:10px; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  .inspect h4 { margin:10px 0 4px; font-size:12px; color:#7a756b; text-transform:uppercase; letter-spacing:.04em; }
  .row { display:flex; align-items:center; gap:6px; }
  .ln { margin:3px 0; } .argue { color:#a2261d; }
  .subs { position:absolute; left:50%; transform:translateX(-50%); bottom:58px; width:min(720px, 70%); }
  .now { background:rgba(255,255,255,.95); border-radius:10px; padding:8px 12px; box-shadow:0 2px 10px rgba(0,0,0,.2); font-size:15px; margin-bottom:6px; }
  .now.argue { border:2px solid #c0392b; color:#1d1d1d; }
  .tag { background:#c0392b; color:#fff; border-radius:5px; padding:1px 6px; font-size:11px; margin-right:6px; vertical-align:2px; }
  .tag.ok { background:#1e8a5a; }
  .subs label { background:rgba(255,255,255,.8); border-radius:6px; padding:1px 6px; }
  .log { background:rgba(255,255,255,.82); border-radius:8px; padding:6px 10px; margin-top:4px; font-size:12.5px; max-height:120px; overflow:auto; }
  .log .ev { color:#7a5a00; }
  .banner { position:absolute; top:62px; left:50%; transform:translateX(-50%); background:#1d1d1d; color:#fff; padding:8px 14px; border-radius:9px; }
  .replay { position:absolute; left:10px; right:10px; bottom:10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; background:rgba(255,255,255,.92);
    padding:6px 10px; border-radius:10px; }
  .replay input[type=range] { flex:1; min-width:200px; }
  .chip { font-size:12px; padding:2px 8px; } .chip.argue { border-color:#e6a1a1; } .chip.ok { border-color:#9bd3b5; }
</style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
